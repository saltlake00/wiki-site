<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" width="400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2a6c"/>
      <stop offset="0.5" stop-color="#3b1e54"/>
      <stop offset="1" stop-color="#0f3460"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#ffd700" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd700"/>
      <stop offset="0.3" stop-color="#fff2a8"/>
      <stop offset="0.5" stop-color="#b8860b"/>
      <stop offset="0.7" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#8b6914"/>
    </linearGradient>
  </defs>
  <rect width="400" height="560" rx="22" fill="url(#bg)"/>
  <rect width="400" height="560" rx="22" fill="url(#glow)"/>
  <!-- 기어 링 -->
  <g transform="translate(200,240)">
    <circle r="95" fill="none" stroke="url(#metal)" stroke-width="10"/>
    <circle r="55" fill="#0d1b2a" stroke="url(#metal)" stroke-width="6"/>
    <circle r="55" fill="none"/>
    <!-- 이빨 -->
    <g stroke="url(#metal)" stroke-width="14" stroke-linecap="round">
      <line x1="0" y1="-95" x2="0" y2="-120"/>
      <line x1="0" y1="95" x2="0" y2="120"/>
      <line x1="-95" y1="0" x2="-120" y2="0"/>
      <line x1="95" y1="0" x2="120" y2="0"/>
      <line x1="-67" y1="-67" x2="-85" y2="-85"/>
      <line x1="67" y1="-67" x2="85" y2="-85"/>
      <line x1="-67" y1="67" x2="-85" y2="85"/>
      <line x1="67" y1="67" x2="85" y2="85"/>
    </g>
    <circle r="8" fill="url(#metal)"/>
  </g>
</svg>
